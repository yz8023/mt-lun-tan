name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build 后发布 GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release 标签（发布时使用）
        required: true
        type: string
        default: v5.32

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 Android runner 已预装 SDK。旧的 setup-android 步骤连续在 SDK
      # 初始化阶段失败，反而使真正的编译从未执行。
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.13
        run: |
          curl --fail --retry 3 -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.13/bin" >> "$GITHUB_PATH"

      # 签名优先由 Actions Secrets 注入；Secrets 未配置时回退到仓库内置的演示
      # keystore（口令与 v2.0~v5.21 公开历史相同）。发布源码压缩包通过
      # .gitattributes export-ignore 永久排除 keystore 与 signing.properties。
      - name: Configure release signing when CI secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
            chmod 600 app/keystore.jks
            echo "Release signing keystore restored from Actions Secrets."
          elif [ -s app/keystore.jks ]; then
            # 回退：仓库内置演示 keystore + 本地 signing.properties（已被 .gitignore 忽略）。
            # 配置 Actions Secrets 后自动改走上面的注入路径，届时应移除该回退文件。
            printf 'storeFile=app/keystore.jks\nstorePassword=mtforum123\nkeyAlias=mtforum\nkeyPassword=mtforum123\n' > app/signing.properties
            chmod 600 app/signing.properties
            echo "Release signing secrets are unavailable; falling back to the repo-bundled demo keystore."
          else
            echo "Release signing secrets are unavailable and no fallback keystore exists; CI will validate an unsigned release build."
          fi

      # cloudflared 隧道已移除；本机只读 MCP 不需要内置 native tunnel binary。
      - name: Report APK size budget
        run: |
          du -sh app/src/main/res app/src/main/java 2>/dev/null || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Require signing for published releases
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || ((github.event_name == 'push' && startsWith(github.ref_name, 'arena/') && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -s app/keystore.jks || { echo "Release signing keystore is unavailable; refusing to publish an unsigned APK."; exit 1; }
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing material from Actions Secrets verified."
          elif [ -f app/signing.properties ]; then
            echo "Actions Secrets unavailable; using the repo-bundled fallback signing configuration."
          else
            echo "Release signing secrets are incomplete and no fallback exists; refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Build optimized release APK
        env:
          ANDROID_KEYSTORE_PATH: app/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          VERSION=$(awk '/versionName/{gsub(/"/, "", $2); print $2; exit}' app/build.gradle)
          OUT="MTForum-v${VERSION}-release.apk"
          SOURCE="MTForum-v${VERSION}-source.zip"
          cp "$APK" "$OUT"
          # 已存在的标签必须打包该标签对应的源码；首次发布时则打包当前提交。
          SOURCE_REF="HEAD"
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && SOURCE_REF="v${VERSION}"
          git archive --format=zip --prefix="MTForum-v${VERSION}/" -o "$SOURCE" "$SOURCE_REF"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          SIZE=$(du -h "$OUT" | awk '{print $1}')
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # APK 与源码分别上传，避免 Actions 再把二者套进同一个下载压缩包。
      # 正式 GitHub Release 中也保持为两个独立资产，但归属于同一个版本标签。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-apk
          path: ${{ steps.artifact.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-source
          path: ${{ steps.artifact.outputs.source_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || ((github.event_name == 'push' && startsWith(github.ref_name, 'arena/') && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('v{0}', steps.artifact.outputs.version) }}
          APK: ${{ steps.artifact.outputs.path }}
          SOURCE: ${{ steps.artifact.outputs.source_path }}
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_SHA256: ${{ steps.artifact.outputs.source_sha256 }}
          APK_SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          test "$TAG" = "v$VERSION" || { echo "标签 $TAG 与应用版本 v$VERSION 不一致"; exit 1; }
          cat > release-notes.md <<EOF
          - **修复：踢帖明明成功却提示「踢帖失败」**。原因是踢帖复用了评分/打赏的成功判定函数，那个函数只认 `succeedhandle_rate`、`评分成功`、`打赏成功` 等**评分**字样，踢帖接口的返回文案一个都匹配不上，于是服务端踢成功了客户端也一律走失败分支。已新增踢帖专用判定。
          - **失败时显示站点的真实原因**。以前不管站点返回什么，都只弹一个没信息量的「踢帖失败」。现在会从响应里抽取提示文案（如「今日踢帖次数已达上限」「该帖子不存在或已被删除」「验证已失效」）并一并显示，便于判断到底卡在哪。
          - **新增：踢帖预选理由**。弹窗里加了 5 个快捷理由（与踢帖规则一一对应：广告引流色情 / 政治宗教敏感 / 低价值收费 / 辱骂引战 / 其它违规），点一下即填入输入框，仍可再手动修改，不用每次从零打字。

          **APK 大小：** ${APK_SIZE}

          \`\`\`
          SHA256  ${APK}  ${SHA256}
          SHA256  ${SOURCE}  ${SOURCE_SHA256}
          \`\`\`

          签名配置优先由 CI Secrets 注入；发布源码压缩包通过 export-ignore 排除 keystore 与签名属性。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTForum v${VERSION} — 踢帖修复 · 预选理由" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$APK" "$SOURCE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MTForum v${VERSION} — 踢帖修复 · 预选理由" \
              --notes-file release-notes.md \
              --latest
          fi
