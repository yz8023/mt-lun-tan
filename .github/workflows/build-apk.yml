name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build 后发布 GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release 标签（发布时使用）
        required: true
        type: string
        default: v4.0

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 Android runner 已预装 SDK。旧的 setup-android 步骤连续在 SDK
      # 初始化阶段失败，反而使真正的编译从未执行。
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.13
        run: |
          curl --fail --retry 3 -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build optimized release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          VERSION=$(awk '/versionName/{gsub(/"/, "", $2); print $2; exit}' app/build.gradle)
          OUT="MTForum-v${VERSION}-release.apk"
          SOURCE="MTForum-v${VERSION}-source.zip"
          cp "$APK" "$OUT"
          # 已存在的标签必须打包该标签对应的源码；首次发布时则打包当前提交。
          SOURCE_REF="HEAD"
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && SOURCE_REF="v${VERSION}"
          git archive --format=zip --prefix="MTForum-v${VERSION}/" -o "$SOURCE" "$SOURCE_REF"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          SIZE=$(du -h "$OUT" | awk '{print $1}')
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload release APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-release
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.source_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref_name, 'arena/') && contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('v{0}', steps.artifact.outputs.version) }}
          APK: ${{ steps.artifact.outputs.path }}
          SOURCE: ${{ steps.artifact.outputs.source_path }}
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_SHA256: ${{ steps.artifact.outputs.source_sha256 }}
          APK_SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          test "$TAG" = "v$VERSION" || { echo "标签 $TAG 与应用版本 v$VERSION 不一致"; exit 1; }
          cat > release-notes.md <<EOF
          ## MTForum v${VERSION}

          - 发帖页新增完整 BBCode 快捷工具栏、色板和实时预览。
          - 帖子可在后台保存为应用内离线页面，可选是否抓取全部评论，并内嵌正文图片。
          - 新增已保存帖子列表，支持无网络查看和删除本地留存。
          - 支持导出 HTML、纯文本及 PDF，可选择保存位置和是否包含评论。
          - 侧边栏新增用户 UID / 帖子 TID 快速跳转。
          - 延续 v3.9 的图片压缩、视频转 GIF、下载方式选择及 R8 安装包瘦身。

          **APK 大小：** ${APK_SIZE}

          \`\`\`
          SHA256  ${APK}  ${SHA256}
          SHA256  ${SOURCE}  ${SOURCE_SHA256}
          \`\`\`

          与 v2.0 起版本使用相同签名，可直接覆盖升级。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTForum v${VERSION} — 离线导出与快捷编辑" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$APK" "$SOURCE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MTForum v${VERSION} — 离线导出与快捷编辑" \
              --notes-file release-notes.md \
              --latest
          fi
