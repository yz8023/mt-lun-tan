name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build 后发布 GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release 标签（发布时使用）
        required: true
        type: string
        default: v5.19

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 Android runner 已预装 SDK。旧的 setup-android 步骤连续在 SDK
      # 初始化阶段失败，反而使真正的编译从未执行。
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.13
        run: |
          curl --fail --retry 3 -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.13/bin" >> "$GITHUB_PATH"

      # build99: 不再往安装包里塞 cloudflared。
      # 它压缩后就有 17 MB，占整个 APK 的 82%（实测 20.81 MB 里 17.02 MB 是它），
      # 而它只服务于「公网 MCP 隧道」这一个功能 —— 该功能用户判定无效，
      # 本轮已整体移除。去掉后 APK 约 3.8 MB。
      - name: Report APK size budget
        run: |
          du -sh app/src/main/res app/src/main/java 2>/dev/null || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build optimized release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          VERSION=$(awk '/versionName/{gsub(/"/, "", $2); print $2; exit}' app/build.gradle)
          OUT="MTForum-v${VERSION}-release.apk"
          SOURCE="MTForum-v${VERSION}-source.zip"
          cp "$APK" "$OUT"
          # 已存在的标签必须打包该标签对应的源码；首次发布时则打包当前提交。
          SOURCE_REF="HEAD"
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && SOURCE_REF="v${VERSION}"
          git archive --format=zip --prefix="MTForum-v${VERSION}/" -o "$SOURCE" "$SOURCE_REF"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          SIZE=$(du -h "$OUT" | awk '{print $1}')
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # APK 与源码分别上传，避免 Actions 再把二者套进同一个下载压缩包。
      # 正式 GitHub Release 中也保持为两个独立资产，但归属于同一个版本标签。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-apk
          path: ${{ steps.artifact.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-source
          path: ${{ steps.artifact.outputs.source_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref_name, 'arena/') && contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('v{0}', steps.artifact.outputs.version) }}
          APK: ${{ steps.artifact.outputs.path }}
          SOURCE: ${{ steps.artifact.outputs.source_path }}
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_SHA256: ${{ steps.artifact.outputs.source_sha256 }}
          APK_SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          test "$TAG" = "v$VERSION" || { echo "标签 $TAG 与应用版本 v$VERSION 不一致"; exit 1; }
          cat > release-notes.md <<EOF
          ## MTForum v${VERSION}

          - **回复关键词过滤**：移除精准/模糊选择，默认关键词改为包含匹配并可逐行自定义；保留「感谢分享 + 帖子标题」和自动解锁模板识别，含有实质内容的回复不按模板误判。
          - **评论区图片**：进一步处理 Discuz 中尺寸缩略图；只有确认签名 aid 或 HTML 原图链接后才切换到原始附件，不从裸数字 aid 猜地址。
          - **首页图片预览**：单张图片铺满卡片预览；双图根据实际容器宽度计算固定尺寸并居中裁切，避免只显示边角。
          - **附件下载**：解码常见乱码/百分号编码文件名，确认弹窗展示保存名与扩展名，支持复制直链；APK 作为安装包类型下载。
          - **链接与表情**：回复链接跟随应用内/系统浏览器设置；Discuz 表情保持小尺寸行内显示，不再套用正文大图样式。
          - 回复过滤只调整本地显示，不删除论坛内容，也不影响服务器回复数量。

          **APK 大小：** ${APK_SIZE}

          \`\`\`
          SHA256  ${APK}  ${SHA256}
          SHA256  ${SOURCE}  ${SOURCE_SHA256}
          \`\`\`

          与 v2.0 起版本使用相同签名，可直接覆盖升级。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTForum v${VERSION} — 回复过滤 · 图片 · 附件下载" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$APK" "$SOURCE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MTForum v${VERSION} — 回复过滤 · 图片 · 附件下载" \
              --notes-file release-notes.md \
              --latest
          fi
