name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build 后发布 GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release 标签（发布时使用）
        required: true
        type: string
        default: v5.15

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 Android runner 已预装 SDK。旧的 setup-android 步骤连续在 SDK
      # 初始化阶段失败，反而使真正的编译从未执行。
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.13
        run: |
          curl --fail --retry 3 -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.13/bin" >> "$GITHUB_PATH"

      # cloudflared 是 App 内免费公网 MCP 隧道的实际运行程序。固定官方版本和
      # SHA256，避免 latest 漂移或供应链内容被静默替换。Android 会从
      # nativeLibraryDir 以可执行权限解压这个 arm64 静态 ELF。
      - name: Bundle verified cloudflared for arm64
        run: |
          set -euo pipefail
          VERSION=2026.9.3
          SHA256=aaeb2d7d0da3614634c7e03ab13487a1522c2e79165ed2929cfe23d5e95b326d
          DIR=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DIR"
          curl --fail --retry 3 -sSL \
            -o "$DIR/libcloudflared.so" \
            "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-arm64"
          echo "$SHA256  $DIR/libcloudflared.so" | sha256sum -c -
          chmod 755 "$DIR/libcloudflared.so"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build optimized release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          VERSION=$(awk '/versionName/{gsub(/"/, "", $2); print $2; exit}' app/build.gradle)
          OUT="MTForum-v${VERSION}-release.apk"
          SOURCE="MTForum-v${VERSION}-source.zip"
          cp "$APK" "$OUT"
          # 已存在的标签必须打包该标签对应的源码；首次发布时则打包当前提交。
          SOURCE_REF="HEAD"
          git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null && SOURCE_REF="v${VERSION}"
          git archive --format=zip --prefix="MTForum-v${VERSION}/" -o "$SOURCE" "$SOURCE_REF"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          SIZE=$(du -h "$OUT" | awk '{print $1}')
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # APK 与源码分别上传，避免 Actions 再把二者套进同一个下载压缩包。
      # 正式 GitHub Release 中也保持为两个独立资产，但归属于同一个版本标签。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-apk
          path: ${{ steps.artifact.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTForum-v${{ steps.artifact.outputs.version }}-source
          path: ${{ steps.artifact.outputs.source_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref_name, 'arena/') && contains(github.event.head_commit.message, '[release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('v{0}', steps.artifact.outputs.version) }}
          APK: ${{ steps.artifact.outputs.path }}
          SOURCE: ${{ steps.artifact.outputs.source_path }}
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_SHA256: ${{ steps.artifact.outputs.source_sha256 }}
          APK_SIZE: ${{ steps.artifact.outputs.size }}
        run: |
          test "$TAG" = "v$VERSION" || { echo "标签 $TAG 与应用版本 v$VERSION 不一致"; exit 1; }
          cat > release-notes.md <<EOF
          ## MTForum v${VERSION}

          - **帖子正文代码一键复制（重做）**：不再靠 JS 猜站点结构，改由 App 在渲染前把代码块替换成自带「复制」按钮的卡片，另加「复制正文」长按面板可逐段复制代码。
          - **快捷回复可勾选 / 可编辑 / 可删除**：新增管理面板，勾上的才显示在快捷条；支持 {title}、{author}、{to}、{forum}、{floor}、{url}、{tid}、{username}、{uid}、{date}、{time} 十一个占位符。
          - **发帖快捷标签**：标签字段名解析不到时退回 Discuz 标准名 tags（以前会直接禁用标签功能）；标签选择器支持本地筛选、站内搜索、手动添加，编辑帖子时自动带出已有标签。
          - **BBCode 快捷键补齐**：[qq]、[hr]、[media=x,500,375]、[email=地址]名称[/email]、[url=地址]名字[/url]，带参数的标签走弹窗填充并替换选区。
          - **修复用了 [code] 之后颜色全部变成字面量**：根因是 Html.fromHtml 的 ParagraphStyle 段落边界校验失败（代码块前必须补 <br>），现在代码块前后样式都正常。

          **APK 大小：** ${APK_SIZE}

          \`\`\`
          SHA256  ${APK}  ${SHA256}
          SHA256  ${SOURCE}  ${SOURCE_SHA256}
          \`\`\`

          与 v2.0 起版本使用相同签名，可直接覆盖升级。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTForum v${VERSION} — 正文代码一键复制 · 快捷回复可勾选 · 发帖标签 · [code] 预览修复" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG" "$APK" "$SOURCE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MTForum v${VERSION} — 正文代码一键复制 · 快捷回复可勾选 · 发帖标签 · [code] 预览修复" \
              --notes-file release-notes.md \
              --latest
          fi
