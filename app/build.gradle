plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

// ==================== 关于 cloudflared（v5.16 起已移除）====================
// v4.4~v5.15 期间这里会下载官方 arm64 cloudflared 打进 jniLibs，用于「公网 MCP 隧道」。
// 该功能用户判定无效，v5.16 已整体移除；这个任务一并删掉 —— 它压缩后 17 MB，
// 占整个 APK 的 82%（实测 20.81 MB 里 17.02 MB 是它），是「安装包体积过大」的直接原因。
// 顺带一提：正因为它是构建时下载的，GitHub Actions 的源码包从来不含它，
// 而 release 工作流会把它塞进 APK —— 于是「源码构建出的包」和「发布包」体积差 5 倍。
// 现在两边一致，都不再包含任何 native 二进制。

android {
    namespace 'com.solosu.mtforum'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.mtforum'
        minSdk 29
        targetSdk 34
        versionCode 55
        versionName "5.20"
        // 应用界面只有中/英文资源，去掉依赖库中不会使用的几十套翻译。
        resourceConfigurations += ['zh', 'en']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'mtforum123'
            keyAlias 'mtforum'
            keyPassword 'mtforum123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Release 使用 R8 删除未使用代码/资源并优化字节码，显著减小 APK。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.webkit
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.work
    implementation libs.androidx.dynamicanimation

    testImplementation libs.junit
}
