plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.solosu.mtforum'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.mtforum'
        minSdk 29
        targetSdk 34
        versionCode 33
        versionName "4.8"
        // 应用界面只有中/英文资源，去掉依赖库中不会使用的几十套翻译。
        resourceConfigurations += ['zh', 'en']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'mtforum123'
            keyAlias 'mtforum'
            keyPassword 'mtforum123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Release 使用 R8 删除未使用代码/资源并优化字节码，显著减小 APK。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.webkit
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.work
    implementation libs.androidx.dynamicanimation

    testImplementation libs.junit
}
