plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

// ==================== cloudflared（公网 MCP 隧道）====================
// CHANGELOG v4.4 起就写着「构建时下载并校验官方 cloudflared 2026.9.3 arm64 静态程序」，
// 但 build.gradle 被工具重新生成时把这个任务丢掉了，导致从仓库源码构建出的 APK
// 比发布版少了 lib/arm64-v8a/libcloudflared.so（约 21MB），
// 公网 MCP / Quick Tunnel 直接不可用。
// 这里补回来：缺文件时才下载，已有文件（含本地手动放置的）不重复拉。
def cloudflaredVersion = '2026.9.3'
def cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/download/${cloudflaredVersion}/cloudflared-linux-arm64"
def cloudflaredDir = file("src/main/jniLibs/arm64-v8a")
def cloudflaredBin = file("src/main/jniLibs/arm64-v8a/libcloudflared.so")

tasks.register('fetchCloudflared') {
    outputs.file(cloudflaredBin)
    outputs.upToDateWhen { cloudflaredBin.isFile() && cloudflaredBin.length() > 1024L * 1024L }
    doLast {
        if (cloudflaredBin.isFile() && cloudflaredBin.length() > 1024L * 1024L) {
            logger.lifecycle("cloudflared 已存在，跳过下载（${cloudflaredBin.length()} B）")
            return
        }
        cloudflaredDir.mkdirs()
        logger.lifecycle("下载 cloudflared ${cloudflaredVersion} (arm64) ...")
        try {
            new URL(cloudflaredUrl).withInputStream { input ->
                cloudflaredBin.withOutputStream { output -> output << input }
            }
        } catch (Exception e) {
            // 不阻断构建：App 端对「安装包不含 cloudflared」已有明确提示，
            // 这里只大声警告，避免离线/受限网络下整个 release 构建失败。
            logger.warn("[cloudflared] 下载失败：${e.message}；公网 MCP 隧道在本安装包中不可用。")
            return
        }
        if (!cloudflaredBin.isFile() || cloudflaredBin.length() < 1024L * 1024L) {
            logger.warn("[cloudflared] 下载结果异常，已清理；公网 MCP 隧道在本安装包中不可用。")
            cloudflaredBin.delete()
            return
        }
        // 粗校验 ELF 魔数：下载到错误页/截断文件时能立刻发现
        byte[] magic = new byte[4]
        cloudflaredBin.withInputStream { it.read(magic, 0, 4) }
        if (!(magic[0] == (byte) 0x7F && magic[1] == (byte) 'E' && magic[2] == (byte) 'L' && magic[3] == (byte) 'F')) {
            logger.warn("[cloudflared] 文件不是 ELF 可执行程序，已清理；公网 MCP 隧道在本安装包中不可用。")
            cloudflaredBin.delete()
            return
        }
        logger.lifecycle("cloudflared 就绪：${cloudflaredBin.length()} B")
    }
}

// build84: cloudflared 不再默认打进安装包。
// 它一个文件压缩后 17MB，占整个 APK 的 82%（实测总包 20.8MB，去掉它只剩 3.8MB），
// 而它只服务于「公网 MCP 隧道」这一个可选功能。改为 App 端首次启用隧道时按需下载
// （见 mcp/CloudflareTunnelManager.ensureBinary()）。
//
// 因此这里<b>不再</b>把 fetchCloudflared 挂到 preBuild / JniLibFolders 上——
// 之前那么做导致任何构建都会自动把 37MB 二进制拉回 jniLibs 再打进包里，
// 这也是「安装包太大」的直接原因。
// 若确实需要打出「含 cloudflared」的旧式安装包，手动执行：
//     gradle fetchCloudflared :app:assembleRelease

android {
    namespace 'com.solosu.mtforum'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.mtforum'
        minSdk 29
        targetSdk 34
        versionCode 40
        versionName "5.5"
        // 应用界面只有中/英文资源，去掉依赖库中不会使用的几十套翻译。
        resourceConfigurations += ['zh', 'en']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'mtforum123'
            keyAlias 'mtforum'
            keyPassword 'mtforum123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Release 使用 R8 删除未使用代码/资源并优化字节码，显著减小 APK。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.webkit
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.work
    implementation libs.androidx.dynamicanimation

    testImplementation libs.junit
}
