plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('app/signing.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}
def releaseStorePath = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStoreFile = releaseStorePath ? rootProject.file(releaseStorePath) : null
def releaseStorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def releaseSigningReady = releaseStoreFile != null && releaseStoreFile.isFile()
        && releaseStorePassword && releaseKeyAlias && releaseKeyPassword


// cloudflared 公网隧道已移除；当前恢复的 MCP 只绑定本机回环，无需 native tunnel binary。
// 旧版 17 MB cloudflared 是此前 APK 体积过大的主因；源码构建与 CI APK 均不再拉取或打包它。


android {
    namespace 'com.solosu.mtforum'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solosu.mtforum'
        minSdk 29
        targetSdk 34
        versionCode 63
        versionName "5.28"
        // 应用界面只有中/英文资源，去掉依赖库中不会使用的几十套翻译。
        resourceConfigurations += ['zh', 'en']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            // 未配置本地/CI 签名材料时允许构建未签名 release 供 CI 编译验证；正式发布由工作流强制要求签名。
            // Release 使用 R8 删除未使用代码/资源并优化字节码，显著减小 APK。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.jsoup
    implementation libs.glide
    implementation libs.okhttp
    implementation libs.swiperefreshlayout
    implementation libs.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.webkit
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.work
    implementation libs.androidx.dynamicanimation

    testImplementation libs.junit
}
